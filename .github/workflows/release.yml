name: release

# Per-platform wheels, each carrying the compiled `aiburn` binary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned macOS images get retired out from under tagged releases;
          # both targets build on Apple Silicon, Intel by cross-compiling.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto # builds portable Linux wheels; cross-compiles aarch64
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing (OIDC): no API token.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PyPI filenames are immutable; skip any already uploaded so re-runs
          # (or partial prior uploads) don't fail the whole publish.
          skip-existing: true
