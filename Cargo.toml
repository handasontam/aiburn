[package]
name = "aiburn"
version = "0.4.0"
edition = "2021"
description = "Fast Claude Code + Codex usage and cost, from your local logs."
license = "MIT"

[[bin]]
name = "aiburn"
path = "src/main.rs"

[dependencies]
rayon = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
